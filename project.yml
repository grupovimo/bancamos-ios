# El proyecto de Xcode sale de acá: `xcodegen generate` (el .xcodeproj no se versiona).
name: Bancamos
options:
  bundleIdPrefix: ar.com.bancamos
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M6935MSNQB
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Bancamos:
    type: application
    platform: iOS
    sources:
      - path: Bancamos
        excludes: [Recursos/PrivacyInfo.xcprivacy]
      # El manifiesto de privacidad (lo pide App Store Connect): como recurso, explícito.
      - path: Bancamos/Recursos/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.bancamos.app
        PRODUCT_NAME: Bancamos
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          # TestFlight por GitHub Actions con firma manual.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.bancamos.app App Store
    info:
      path: Bancamos/Info.plist
      properties:
        CFBundleDisplayName: Bancamos
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Outfit.ttf
        UILaunchScreen:
          UIColorName: Fondo
          UIImageName: Lanzamiento
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Fondo blanco en toda la app: barra de estado oscura.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [whatsapp, mercadopago]
  BancamosTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BancamosTests]
    dependencies:
      - target: Bancamos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bancamos:
    build:
      targets:
        Bancamos: all
        BancamosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [BancamosTests]
